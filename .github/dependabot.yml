# Actualizaciones automáticas de dependencias: Dependabot abre un pull request semanal, que pasa por la
# integración continua y la revisión por pares antes de integrarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Un cambio de versión mayor de Node.js es una decisión explícita: debe aprobarse también en
    # ci/revisar-costos.sh, en el workflow y en "engines" de package.json, no llegar como actualización.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
