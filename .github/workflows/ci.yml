# Integración continua: se ejecuta en cada push y en cada pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Auditoría de dependencias
        # Avisa de vulnerabilidades altas o críticas en las librerías.
        run: npm audit --audit-level=high

      - name: Verificar que la imagen Docker construye
        run: docker build --target runtime -t catalogo-cursos:ci .
