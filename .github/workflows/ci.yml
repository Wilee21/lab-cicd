# Integración continua: se ejecuta en cada push y en cada pull request.
# Aplica las mismas reglas que el pipeline de Jenkins: revisión de costos, secretos, análisis estático,
# pruebas con cobertura mínima (ci/topes-calidad.properties), auditoría de dependencias y construcción
# de la imagen.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7
        with:
          # Historial completo para que Gitleaks revise todos los commits.
          fetch-depth: 0

      - name: Revisión de costos
        run: sh ci/revisar-costos.sh

      - name: Secretos en el historial (Gitleaks)
        run: MONTAR_DIRECTORIO=1 sh ci/gitleaks.sh

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Pruebas y cobertura
        run: |
          mkdir -p reportes
          npm run -s test:cobertura
          node ci/revisar-cobertura.js

      - name: Auditoría de dependencias
        # Reporta vulnerabilidades de severidad alta o crítica en las dependencias.
        run: npm audit --audit-level=high

      - name: Verificar que la imagen Docker construye
        run: docker build --target runtime --build-arg GIT_COMMIT=${{ github.sha }} -t catalogo-cursos:ci .

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: reportes/
          if-no-files-found: ignore
