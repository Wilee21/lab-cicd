# Topes de calidad del pipeline (README, "Topes de calidad").
# Funcionan como un trinquete: la ejecución FALLA si un número empeora respecto a este archivo.
# Cuando un cambio mejora un número, en el mismo commit se ajusta aquí el tope al valor nuevo,
# para que no vuelva a empeorar. Un tope solo se relaja por acuerdo explícito del equipo.
#
# Base medida el 2026-11-20 sobre main: 0 avisos de ESLint y 100 % de cobertura de líneas.

# Máximo de avisos de ESLint (la ejecución falla con uno más).
eslint=0

# Mínimo de cobertura de líneas de src/, en %.
coberturaLineas=100

# SonarQube (ci/sonarqube.sh + ci/revisar-sonarqube.js). Base medida el 2026-11-26 sobre main.
# Máximo de bugs, vulnerabilidades y Security Hotspots: ninguno.
sonarBugs=0
sonarVulnerabilidades=0
sonarHotspots=0
# Máximo de code smells (mantenibilidad).
sonarCodeSmells=0
