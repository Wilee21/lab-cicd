# Configuración completa de Jenkins como código (JCasC). Se aplica en cada arranque.
# Los secretos NO están aquí: llegan como variables de entorno desde el archivo .env (fuera de Git).
jenkins:
  systemMessage: "Jenkins de práctica - Catálogo de cursos (Fundamentos DevOps)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub
              description: "Docker Hub (usuario + token de acceso)"
              username: ${DOCKERHUB_USER}
              password: ${DOCKERHUB_TOKEN}

unclassified:
  location:
    url: http://localhost:8080/

# El job se crea solo: lee el Jenkinsfile del repositorio indicado en GIT_REPO_URL.
jobs:
  - script: >
      pipelineJob('catalogo-cursos-cd') {
        description('Entrega continua: clona, prueba, construye la imagen Docker y la publica en Docker Hub.')
        triggers { scm('H/5 * * * *') }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
