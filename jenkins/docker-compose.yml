# Levanta el Jenkins de práctica:  docker compose up -d --build   (desde esta carpeta)
# Nombre propio del proyecto: evita chocar con otros docker-compose guardados en carpetas "jenkins".
name: lab-cicd

services:
  jenkins:
    build: .
    container_name: jenkins-practica
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    env_file: .env
    environment:
      - DOCKERHUB_USER=${DOCKERHUB_USER}
    volumes:
      - jenkins_home:/var/jenkins_home
      # Jenkins usa el Docker del equipo para construir las imágenes.
      - /var/run/docker.sock:/var/run/docker.sock
    # Permiso para usar el socket de Docker. En Docker Desktop el socket pertenece al grupo 0;
    # en Linux, cambia DOCKER_GID en .env por el resultado de: getent group docker | cut -d: -f3
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      - registry
    restart: unless-stopped

  # Registro de imágenes local (alternativa a Docker Hub para practicar sin cuenta).
  # Jenkins publica aquí cuando REGISTRY_HOST=localhost:5000. Ver: http://localhost:5000/v2/_catalog
  registry:
    image: registry:2
    container_name: registro-practica
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    restart: unless-stopped

volumes:
  jenkins_home:
  registry_data:
